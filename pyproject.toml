[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-api-hub"
version = "1.0.0"
description = "Oracle Database RESTful API Hub - A generic platform to expose Oracle tables, views, functions and procedures as REST APIs with DB-managed SQL definitions"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 is incompatible with bcrypt 4.1+ (removed __about__, self-test
    # raises). Pin to the last compatible line until passlib is replaced.
    "bcrypt>=4.0.1,<4.1",
    "python-multipart>=0.0.6",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "pyyaml>=6.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "oracledb>=3.4.2",
    "psycopg2-binary>=2.9.9",
    "pymssql>=2.2.8",
    # MCP server (mcp_server/ package; StreamableHTTPSessionManager requires >=1.8)
    "mcp>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "flower>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["app*", "mcp_server*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/e2e", "node_modules", ".venv"]

[tool.uv.extra-build-dependencies]
cx-oracle = ["setuptools"]
