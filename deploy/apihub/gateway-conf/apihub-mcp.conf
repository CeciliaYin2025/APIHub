# Oracle API Hub MCP Server routing
# Proxies /apihub/mcp/* -> apihub-mcp:8810/*
# Modeled on ITSM-PM's itpm-mcp.conf (mcp-technical-report.html §10.6 step 9).
#
# IMPORTANT: the upstream Streamable HTTP endpoint is mounted at /mcp/ (with
# a trailing slash) — see mcp_server/http_app.py `Mount("/mcp", ...)`. A bare
# /mcp (no trailing slash) 307-redirects to /mcp/, and that redirect carries
# the *upstream* (unprefixed) Location header through this proxy, which
# breaks clients that don't rewrite it. Always register clients against the
# trailing-slash form: https://<gateway>/apihub/mcp/mcp/
#
# This conf is dropped into the gateway's app-scoped include dir by the
# `apihub-route-register` one-shot container — see docker-compose.yml. Unlike
# apihub.conf (auto-registered), this file must be copied there manually or
# via a similar route-register step if one is added for the MCP service; see
# deploy/isap/README.md "MCP server" section for the manual copy command.

location /apihub/mcp/ {
    # Restrict to internal network only (RFC1918). Mirrors ITSM-PM's
    # itpm-mcp.conf; if this gateway does not already ship
    # conf.d/snippets/internal-only.conf, create it from ITSM-PM's copy
    # (deploy/infrastructure/gateway/conf.d/snippets/internal-only.conf)
    # or inline `allow`/`deny` rules here.
    include /etc/nginx/conf.d/snippets/internal-only.conf;

    set $upstream_apihub_mcp http://apihub-mcp:8810;

    # Strip /apihub/mcp prefix: rewrite URI before proxy.
    rewrite ^/apihub/mcp(/.*) $1 break;
    proxy_pass $upstream_apihub_mcp;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streamable HTTP / SSE-specific settings — long-lived connections.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;    # 24h - long-lived MCP sessions
    proxy_send_timeout 86400s;
    chunked_transfer_encoding on;

    # Disable gzip for event-stream responses.
    proxy_set_header Accept-Encoding "";
}
