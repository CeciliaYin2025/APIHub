# Oracle API Hub — registered route on the ISAP gateway.
# Bare location blocks only (included inside the gateway's server context).
# Uses `set $upstream` lazy resolution so nginx starts even when apihub-api
# is not yet running (per CONTRACT.md).
#
# IMPORTANT: do NOT strip the /apihub prefix here. The app runs with
# root_path=/apihub and strips the prefix itself for routing. If nginx also
# strips it, StaticFiles mounts (/admin/css, /admin/js) 404 because they match
# on root_path + path, while plain routes match the stripped path — so the
# admin HTML would load but its CSS/JS would 404. Forward the full URI.

location = /apihub {
    return 301 /apihub/;
}

# MCP identity bridge — internal only (docker network callers use apihub-api:8000
# directly; this path must never be reachable from outside the gateway host).
# An exact `=` match always outranks the `/apihub/` prefix location below in
# nginx's location-selection order, so this wins regardless of block order —
# it is placed first only for readability.
location = /apihub/api/v1/auth/sso-token {
    deny all;
    return 404;
}

# Also block the trailing-slash variant. Without this it falls through to the
# /apihub/ prefix location; the app's redirect_slashes 307 would then bounce
# the client back to the blocked exact path (still safe), but blocking both
# forms keeps the guarantee independent of application-layer behavior.
location = /apihub/api/v1/auth/sso-token/ {
    deny all;
    return 404;
}

# Flower (Celery monitoring). Longest-prefix match beats /apihub/, so this
# wins for /apihub/flower/* regardless of block order. Auth is Flower's own
# basic auth (FLOWER_BASIC_AUTH in the stack's .env) — the gateway adds none.
# Flower runs with --url-prefix=apihub/flower, so forward the URI unchanged.
location = /apihub/flower {
    return 301 /apihub/flower/;
}

location /apihub/flower/ {
    set $apihub_flower_up http://apihub-flower:5555;
    proxy_pass $apihub_flower_up$request_uri;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
}

location /apihub/ {
    set $apihub_up http://apihub-api:8000;
    # Forward the original URI unchanged (incl. /apihub); root_path handles it.
    proxy_pass $apihub_up$request_uri;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /apihub;

    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # YAML-definition import upload
    client_max_body_size 50m;
}
