# OAuth protected-resource well-known rewrite for the Oracle API Hub MCP
# server — RFC 9728 "insertion form" metadata document.
#
# WHERE THIS GOES: this is NOT an app-scoped conf like apihub.conf /
# apihub-mcp.conf. RFC 9728 clients build the metadata URL by inserting
# /.well-known/oauth-protected-resource at the DOMAIN ROOT:
#   https://isap.sercomm.com/apihub/mcp  (resource identifier)
#     -> https://isap.sercomm.com/.well-known/oauth-protected-resource/apihub/mcp
# No app-scoped `location /apihub/...` block can match a root-level
# `/.well-known/...` path, so this location MUST be added to the gateway's
# root vhost/well-known conf — the platform operator's isap-gateway
# infrastructure repo, alongside the equivalent blocks for other apps (see
# ITSM-PM's deploy/infrastructure/gateway/conf.d/apps/oauth-wellknown.conf
# for the existing itpm/itpm-test entries this mirrors).
#
# This repo cannot self-register this block the way apihub.conf is
# self-registered by `apihub-route-register` (docker-compose.yml), because
# the target file (oauth-wellknown.conf, or equivalent) is a SHARED file
# with entries from every app on the gateway — blind overwrite would delete
# other apps' rewrites. A platform operator must paste this block into that
# shared file by hand (or via the isap-gateway repo's own change process)
# and reload nginx. See deploy/apihub/README.md "MCP server" section.

location ^~ /.well-known/oauth-protected-resource/apihub/mcp {
    include /etc/nginx/conf.d/snippets/internal-only.conf;
    set $upstream_apihub_mcp_wellknown http://apihub-mcp:8810;
    rewrite ^ /.well-known/oauth-protected-resource break;
    proxy_pass $upstream_apihub_mcp_wellknown;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
