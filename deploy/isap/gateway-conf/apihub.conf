# Oracle API Hub — registered route on the ISAP gateway.
# Bare location blocks only (included inside the gateway's server context).
# Uses `set $upstream` lazy resolution so nginx starts even when apihub-api
# is not yet running (per CONTRACT.md).
#
# IMPORTANT: do NOT strip the /apihub prefix here. The app runs with
# root_path=/apihub and strips the prefix itself for routing. If nginx also
# strips it, StaticFiles mounts (/admin/css, /admin/js) 404 because they match
# on root_path + path, while plain routes match the stripped path — so the
# admin HTML would load but its CSS/JS would 404. Forward the full URI.

location = /apihub {
    return 301 /apihub/;
}

location /apihub/ {
    set $apihub_up http://apihub-api:8000;
    # Forward the original URI unchanged (incl. /apihub); root_path handles it.
    proxy_pass $apihub_up$request_uri;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /apihub;

    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # YAML-definition import upload
    client_max_body_size 50m;
}
