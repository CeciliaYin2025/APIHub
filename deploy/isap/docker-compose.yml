# ==============================================================================
# Oracle API Hub — ISAP platform deployment stack
# ==============================================================================
# Self-registers against the shared ISAP infrastructure (CONTRACT.md v1.1):
#   - creates its own DB in isap-postgres (apihub-db-init)
#   - seeds tables + admin user (apihub-migrate)
#   - drops its nginx route and reloads the gateway (apihub-route-register)
#   - api + celery workers join gateway-net / db-net / redis-net
#
# Deploy:  cd deploy/isap && cp .env.example .env && <edit> && docker compose up -d --build
# ==============================================================================

services:
  # ── one-shot: create the platform-store database in shared postgres ───────
  apihub-db-init:
    image: postgres:16-alpine
    container_name: apihub-db-init
    restart: "no"
    env_file: [.env]
    networks: [db-net]
    entrypoint: ["sh", "/db-init/create-database.sh"]
    volumes:
      - ./db-init:/db-init:ro

  # ── one-shot: create tables + seed default admin (idempotent) ─────────────
  apihub-migrate:
    build:
      context: ../..
    image: oracle-api-hub:latest
    container_name: apihub-migrate
    restart: "no"
    env_file: [.env]
    networks: [db-net, redis-net]
    command: ["python", "-m", "scripts.init_db"]
    depends_on:
      apihub-db-init:
        condition: service_completed_successfully

  # ── one-shot: register the gateway route and reload nginx ─────────────────
  apihub-route-register:
    image: docker:27-cli
    container_name: apihub-route-register
    restart: "no"
    volumes:
      - ./gateway-conf/apihub.conf:/conf/apihub.conf:ro
      - ${INFRA_GATEWAY_APPS_DIR:-/opt/isap/gateway-apps}:/dest
      - /var/run/docker.sock:/var/run/docker.sock
    # The whole script MUST live inside this entrypoint list. With
    # `entrypoint: ["sh","-c"]` + a separate multi-line `command:`, Compose splits
    # the command into argv words, so `sh -c` runs only the first token and
    # silently drops the rest — the conf never gets copied. Shell variables are
    # written as `$$` so Compose does not try to interpolate them.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        DEST=/dest/apihub.conf
        BAK=/dest/.apihub.conf.bak
        # Back up any currently-registered conf so a failed update can be rolled
        # back instead of leaving the route deleted from disk.
        [ -f "$$DEST" ] && cp -f "$$DEST" "$$BAK" || true
        cp -f /conf/apihub.conf "$$DEST"
        if docker exec isap-gateway nginx -t; then
          if docker kill -s HUP isap-gateway; then
            echo "apihub route registered and gateway reloaded."
            rm -f "$$BAK"
          else
            echo "route conf valid but SIGHUP reload of isap-gateway failed." >&2
            exit 1
          fi
        else
          echo "nginx -t failed; restoring previous conf to avoid breaking the gateway." >&2
          if [ -f "$$BAK" ]; then mv -f "$$BAK" "$$DEST"; else rm -f "$$DEST"; fi
          exit 1
        fi

  # ── long-running: FastAPI app ─────────────────────────────────────────────
  apihub-api:
    build:
      context: ../..
    image: oracle-api-hub:latest
    container_name: apihub-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      # MCP identity bridge (POST /api/v1/auth/sso-token). Empty secret keeps
      # the endpoint disabled — set it here AND on apihub-mcp with the same
      # value once the MCP OAuth gateway is deployed (Task 8 self-review note).
      MCP_BRIDGE_SECRET: ${MCP_BRIDGE_SECRET:-}
      # Auto-create a role-less local user on first SSO login via the bridge.
      # Off by default per site policy — flip in .env if desired.
      MCP_BRIDGE_AUTOCREATE: ${MCP_BRIDGE_AUTOCREATE:-false}
    networks: [gateway-net, db-net, redis-net]
    volumes:
      # Edit data-source definitions without rebuilding the image — `docker
      # compose restart` reloads them (definitions are read at startup only).
      - ../../app/database_definitions:/app/app/database_definitions
      # Mount an EMPTY dir over the seed YAML so the registry is DB-only in prod
      # (otherwise the baked-in samples appear as undeletable phantom defs).
      - ./sql_definitions:/app/app/sql_definitions
      # Serve the Admin UI from the working tree so UI tweaks (HTML/CSS/JS) only
      # need `git pull` + browser refresh — no image rebuild. Read-only.
      - ../../app/admin:/app/app/admin:ro
    depends_on:
      apihub-migrate:
        condition: service_completed_successfully
      apihub-route-register:
        condition: service_completed_successfully

  # ── long-running: MCP server (Streamable HTTP, OAuth 2.1 Resource Server) ──
  # Thin proxy over apihub-api's REST API — never touches the databases
  # directly. Gateway route: deploy/isap/gateway-conf/apihub-mcp.conf.
  apihub-mcp:
    image: oracle-api-hub:latest
    container_name: apihub-mcp
    restart: unless-stopped
    env_file: [.env]
    environment:
      # docker-internal only — the bridge endpoint (X-Bridge-Secret) is never
      # exposed through the gateway, so this stays off gateway-net entirely.
      MCP_API_HUB_URL: http://apihub-api:8000
      MCP_OAUTH_ENABLED: "true"
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?MCP_PUBLIC_URL is required for OAuth metadata}
      MCP_AUTH_ISSUER: ${MCP_AUTH_ISSUER:?MCP_AUTH_ISSUER is required for OAuth metadata}
      MCP_INTROSPECTION_URL: http://isap-auth:9997/auth/api/v1/introspect
      MCP_INTROSPECTION_SECRET: ${OAUTH_INTROSPECTION_SECRET}
      MCP_BRIDGE_SECRET: ${MCP_BRIDGE_SECRET:-}
    command: ["uvicorn", "mcp_server.http_app:app", "--host", "0.0.0.0", "--port", "8810"]
    # gateway-net only: reaches apihub-api (also on gateway-net) for the REST
    # proxy + identity bridge, and is where the gateway container reaches it.
    # No db-net/redis-net — the MCP server never touches the database or
    # Celery directly (thin HTTP proxy, per mcp_server/README.md).
    networks: [gateway-net]
    depends_on:
      apihub-api:
        condition: service_started

  # ── long-running: Celery write-queue worker ───────────────────────────────
  apihub-celery-write:
    image: oracle-api-hub:latest
    container_name: apihub-celery-write
    restart: unless-stopped
    env_file: [.env]
    networks: [db-net, redis-net]
    volumes:
      - ../../app/database_definitions:/app/app/database_definitions
      - ./sql_definitions:/app/app/sql_definitions
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-Q", "write", "-l", "info", "--concurrency=4"]
    depends_on:
      apihub-api:
        condition: service_started

  # ── long-running: Celery procedure-queue worker ───────────────────────────
  apihub-celery-proc:
    image: oracle-api-hub:latest
    container_name: apihub-celery-proc
    restart: unless-stopped
    env_file: [.env]
    networks: [db-net, redis-net]
    volumes:
      - ../../app/database_definitions:/app/app/database_definitions
      - ./sql_definitions:/app/app/sql_definitions
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-Q", "procedure", "-l", "info", "--concurrency=2"]
    depends_on:
      apihub-api:
        condition: service_started

  # ── optional: Flower (no built-in auth — keep OFF the gateway). Uncomment
  #    and tunnel via SSH if you need it.
  # apihub-flower:
  #   image: oracle-api-hub:latest
  #   container_name: apihub-flower
  #   restart: unless-stopped
  #   env_file: [.env]
  #   networks: [redis-net]
  #   command: ["celery", "-A", "app.tasks.celery_app", "flower", "--port=5555"]
  #   ports: ["127.0.0.1:5555:5555"]

networks:
  gateway-net: { external: true }
  db-net:      { external: true }
  redis-net:   { external: true }
