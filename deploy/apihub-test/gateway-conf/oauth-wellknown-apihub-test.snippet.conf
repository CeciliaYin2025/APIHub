# OAuth protected-resource well-known rewrite for the Oracle API Hub REST API
# — RFC 9728 "insertion form" metadata document.
#
# Only needed when OAUTH_RS_ENABLED=true. Without it the API still accepts
# isap-auth bearer tokens; what breaks is *discovery* — a client that follows
# the WWW-Authenticate challenge cannot fetch the metadata and has no way to
# learn which authorization server to send the user to.
#
# WHERE THIS GOES: same place, and for the same reason, as
# oauth-wellknown-apihub-mcp.snippet.conf. RFC 9728 clients insert
# /.well-known/oauth-protected-resource at the DOMAIN ROOT:
#   https://isap.sercomm.com/apihub-test          (resource identifier)
#     -> https://isap.sercomm.com/.well-known/oauth-protected-resource/apihub-test
# No app-scoped `location /apihub-test/...` block can match a root-level path, so this
# must be added by a platform operator to the gateway's shared root well-known
# conf. This repo cannot self-register it: that file carries entries from every
# app on the gateway and a blind overwrite would delete them.
#
# NOT internal-only, unlike the MCP snippet's upstream: this document is what
# public OAuth clients read before they hold any credential.

location = /.well-known/oauth-protected-resource/apihub-test {
    set $upstream_apihub_test_wellknown http://apihub-test-api:8000;
    rewrite ^ /.well-known/oauth-protected-resource break;
    proxy_pass $upstream_apihub_test_wellknown;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
